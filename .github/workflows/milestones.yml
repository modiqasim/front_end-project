# Lägg filen i ditt repo som: .github/workflows/milestones.yml
name: Skapa milestones

on:
  schedule:
    - cron: "0 5 * * 1"   # Varje måndag 05:00 UTC
  workflow_dispatch:       # Gör att du kan köra den manuellt under Actions-fliken

permissions:
  issues: write            # Krävs för att skapa milestones

jobs:
  create-milestones:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v8
        env:
          # Startvecka (en måndag). Torsdagen den veckan blir torsdag nr 1.
          ANCHOR_DATE: "2026-10-05"
          # Hur många veckor framåt milestones skapas. 6 = en hel cykel med alla tre färger.
          LOOKAHEAD_WEEKS: "6"
        with:
          script: |
            const { owner, repo } = context.repo;
            const DAY = 24 * 60 * 60 * 1000;
            const lookahead = parseInt(process.env.LOOKAHEAD_WEEKS, 10);

            // De tre typerna. Ändra emoji, namn och beskrivning som du vill.
            const types = [
              { every: 1, emoji: "🔵", name: "Veckovis",         description: "Skapas automatiskt varje torsdag" },
              { every: 2, emoji: "🟢", name: "Varannan vecka",   description: "Skapas automatiskt varannan torsdag" },
              { every: 3, emoji: "🔴", name: "Var tredje vecka", description: "Skapas automatiskt var tredje torsdag" },
            ];

            // ISO-veckonummer och ISO-år
            function isoWeek(date) {
              const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
              const day = d.getUTCDay() || 7;
              d.setUTCDate(d.getUTCDate() + 4 - day);
              const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
              return {
                week: Math.ceil(((d - yearStart) / DAY + 1) / 7),
                year: d.getUTCFullYear(),
              };
            }

            // Måndagen i innevarande vecka (UTC)
            const now = new Date();
            const thisMonday = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
            thisMonday.setUTCDate(thisMonday.getUTCDate() - ((thisMonday.getUTCDay() + 6) % 7));

            const anchor = new Date(process.env.ANCHOR_DATE + "T00:00:00Z");

            // Hämta befintliga milestones så att vi inte skapar dubbletter
            const existing = await github.paginate(github.rest.issues.listMilestones, {
              owner, repo, state: "all", per_page: 100,
            });
            const titles = new Set(existing.map(m => m.title));

            let created = 0;

            // Gå igenom innevarande vecka och kommande veckor
            for (let offset = 0; offset < lookahead; offset++) {
              const monday = new Date(thisMonday.getTime() + offset * 7 * DAY);
              const weeksSince = Math.round((monday - anchor) / (7 * DAY));
              if (weeksSince < 0) continue; // Före startveckan

              // Torsdag nr 1 = startveckan. Grön på nr 2, 4, 6 … och röd på nr 3, 6, 9 …
              const thursdayNo = weeksSince + 1;

              const due = new Date(monday.getTime() + 3 * DAY);
              due.setUTCHours(12);
              const { week, year } = isoWeek(due);

              for (const t of types) {
                if (thursdayNo % t.every !== 0) continue;

                const title = `${t.emoji} ${t.name} v${week} ${year}`;
                if (titles.has(title)) {
                  core.info(`Finns redan: ${title}`);
                  continue;
                }

                await github.rest.issues.createMilestone({
                  owner, repo,
                  title,
                  description: t.description,
                  due_on: due.toISOString(),
                });
                titles.add(title);
                created++;
                core.info(`Skapade: ${title} (deadline ${due.toISOString().slice(0, 10)})`);
              }
            }

            core.info(`Klart. ${created} nya milestones skapades.`);
