# Lägg filen i ditt repo som: .github/workflows/milestone-dates.yml
name: Sätt datum från milestone

on:
  issues:
    types: [milestoned, demilestoned]

# Kör en händelse i taget per issue så att byte av milestone inte krockar
concurrency:
  group: milestone-dates-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: read

jobs:
  set-dates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v8
        env:
          # Ditt användarnamn eller organisationsnamn (det som står i projektets URL)
          PROJECT_OWNER: "ditt-namn-här"
          # Projektets nummer, t.ex. 3 från github.com/users/ditt-namn/projects/3
          PROJECT_NUMBER: "1"
          # Namnen på datumfälten i projektet (måste stämma exakt)
          START_FIELD: "Start date"
          TARGET_FIELD: "Target date"
        with:
          # Standard-token kan inte ändra i Projects, därför används en egen token
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const login = process.env.PROJECT_OWNER;
            const number = parseInt(process.env.PROJECT_NUMBER, 10);
            const START = process.env.START_FIELD;
            const TARGET = process.env.TARGET_FIELD;
            const issue = context.payload.issue;
            const milestone = context.payload.milestone;
            const action = context.payload.action;

            // 1. Hämta projektet (fungerar för både organisation och användare)
            async function getProject() {
              for (const kind of ["organization", "user"]) {
                try {
                  const res = await github.graphql(`
                    query($login: String!, $number: Int!) {
                      ${kind}(login: $login) {
                        projectV2(number: $number) {
                          id
                          fields(first: 50) { nodes { ... on ProjectV2Field { id name dataType } } }
                        }
                      }
                    }`, { login, number });
                  if (res[kind]?.projectV2) return res[kind].projectV2;
                } catch (e) {
                  core.info(`Inte ${kind === "user" ? "en användare" : "en organisation"}: ${e.message}`);
                }
              }
              throw new Error(`Hittade inget projekt nr ${number} hos ${login}. Kontrollera PROJECT_OWNER, PROJECT_NUMBER och att PROJECT_TOKEN har rätt behörigheter.`);
            }

            const project = await getProject();
            const fieldId = (name) => {
              const f = project.fields.nodes.find(n => n && n.name === name);
              if (!f) throw new Error(`Hittade inget fält som heter "${name}" i projektet.`);
              return f.id;
            };
            const targetFieldId = fieldId(TARGET);
            const startFieldId = START ? fieldId(START) : null;

            // 2. Hitta issuens rad i projektet
            const itemRes = await github.graphql(`
              query($id: ID!, $start: String!, $target: String!) {
                node(id: $id) {
                  ... on Issue {
                    projectItems(first: 50) {
                      nodes {
                        id
                        project { id }
                        start: fieldValueByName(name: $start) { ... on ProjectV2ItemFieldDateValue { date } }
                        target: fieldValueByName(name: $target) { ... on ProjectV2ItemFieldDateValue { date } }
                      }
                    }
                  }
                }
              }`, { id: issue.node_id, start: START || TARGET, target: TARGET });

            let item = itemRes.node.projectItems.nodes.find(n => n.project.id === project.id);

            const setDate = (fieldId, date) => github.graphql(`
              mutation($p: ID!, $i: ID!, $f: ID!, $d: Date!) {
                updateProjectV2ItemFieldValue(input: { projectId: $p, itemId: $i, fieldId: $f, value: { date: $d } }) {
                  projectV2Item { id }
                }
              }`, { p: project.id, i: item.id, f: fieldId, d: date });

            const clearDate = (fieldId) => github.graphql(`
              mutation($p: ID!, $i: ID!, $f: ID!) {
                clearProjectV2ItemFieldValue(input: { projectId: $p, itemId: $i, fieldId: $f }) {
                  projectV2Item { id }
                }
              }`, { p: project.id, i: item.id, f: fieldId });

            // 3a. Issuen fick en milestone: sätt datumen
            if (action === "milestoned") {
              if (!milestone?.due_on) {
                core.info(`Milestonen "${milestone?.title}" saknar deadline. Inget ändras.`);
                return;
              }
              const due = milestone.due_on.slice(0, 10);

              // Lägg till issuen i projektet om den inte redan finns där
              if (!item) {
                const added = await github.graphql(`
                  mutation($p: ID!, $c: ID!) {
                    addProjectV2ItemById(input: { projectId: $p, contentId: $c }) { item { id } }
                  }`, { p: project.id, c: issue.node_id });
                item = { id: added.addProjectV2ItemById.item.id, start: null, target: null };
                core.info(`Lade till issue #${issue.number} i projektet.`);
              }

              await setDate(targetFieldId, due);
              core.info(`${TARGET} = ${due} för issue #${issue.number}.`);

              // Sätt startdatum till deadline om det saknas eller ligger efter deadline
              const start = item.start?.date;
              if (startFieldId && (!start || start > due)) {
                await setDate(startFieldId, due);
                core.info(`${START} = ${due} (saknades eller låg efter deadline).`);
              }
              return;
            }

            // 3b. Milestonen togs bort: rensa datum som kom från den
            if (action === "demilestoned") {
              if (!item) return;

              // Om issuen redan har fått en ny milestone tar den andra körningen hand om det
              const { data: current } = await github.rest.issues.get({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
              });
              if (current.milestone) {
                core.info("Issuen har en ny milestone. Inget rensas.");
                return;
              }

              const oldDue = milestone?.due_on?.slice(0, 10);
              if (oldDue && item.target?.date === oldDue) {
                await clearDate(targetFieldId);
                core.info(`Rensade ${TARGET} för issue #${issue.number}.`);
              }
              if (oldDue && startFieldId && item.start?.date === oldDue) {
                await clearDate(startFieldId);
                core.info(`Rensade ${START} för issue #${issue.number}.`);
              }
            }
